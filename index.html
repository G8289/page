<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网盘资源效率工作台 v6.4 (UI右对齐版)</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; max-width: 1000px; margin: 0 auto; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 12px 25px; font-size: 15px; font-weight: bold; background-color: transparent; color: #7f8c8d; border: none; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.3s; margin-bottom: -13px; }
        .tab-btn:hover { color: #3498db; }
        .tab-btn.active { color: #3498db; border-bottom: 3px solid #3498db; }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .container { display: flex; gap: 20px; margin-bottom: 20px; }
        .box { flex: 1; display: flex; flex-direction: column; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        label { font-weight: bold; margin-bottom: 10px; color: #34495e; display: flex; justify-content: space-between; align-items: center; }
        .hint { font-size: 12px; color: #e74c3c; font-weight: normal; }
        
        textarea { width: 100%; height: 250px; padding: 12px; border: 2px solid #ddd; border-radius: 6px; resize: vertical; font-family: monospace; font-size: 14px; box-sizing: border-box; transition: all 0.3s; background-color: #fafafa; }
        textarea:focus { border-color: #3498db; outline: none; background-color: #fff; }
        textarea.drag-over { border: 2px dashed #27ae60 !important; background-color: #eafaf1 !important; }
        
        .btn-main { display: block; width: 100%; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
        .btn-green { background-color: #27ae60; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .btn-purple { background-color: #9b59b6; box-shadow: 0 4px 15px rgba(155, 89, 182, 0.3); }
        .btn-blue { background-color: #3498db; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3); }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .btn-small { padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; margin-left: 5px; transition: all 0.3s ease; }
        .btn-copy { background-color: #3498db; }
        .btn-copy:hover { background-color: #2980b9; }
        .btn-dl { background-color: #2ecc71; }
        /* 修改：加入了 margin: 0 0 15px auto; 让按钮靠右对齐 */
        .btn-dl-all { background-color: #e67e22; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; margin: 0 0 15px auto; }

        #output-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 20px; }
        .result-card { background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <h2>🛠️ 网盘资源效率工作台</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'tool1')">1. 极简合并</button>
        <button class="tab-btn" onclick="switchTab(event, 'tool2')">2. 模板发帖</button>
        <button class="tab-btn" onclick="switchTab(event, 'tool3')">3. 目录树生成</button>
    </div>

    <div id="tool1" class="tab-content active">
        <div class="container">
            <div class="box"><label>文本 1：</label><textarea id="text1"></textarea></div>
            <div class="box"><label>文本 2：</label><textarea id="text2"></textarea></div>
        </div>
        <button class="btn-main btn-green" onclick="mergeTextsSimple()">✨ 开始合并文本</button>
        <div class="box"><label>结果：<button class="btn-small btn-copy" onclick="smoothCopy('result1', this)">📋 复制</button></label><textarea id="result1" readonly style="height: 300px;"></textarea></div>
    </div>

    <div id="tool2" class="tab-content">
        <div class="container">
            <div class="box"><label>模板：</label><textarea id="templateText">BD-
{BD}

KK-
{KK}

解压密码：XWhome@661
-------------------------FM优惠码: 0EEMIY----------------------------------

ヽ(*・ω・)ﾉ 网速救星 / 虾片神器 / 追剧外挂 / 性价比极高 / 价格低至9.9/月 ٩(◕‿◕｡)۶

26年4月机场圈“至暗时刻”，相信各位有目共睹。我推荐的自用机场完美硬抗，歌照唱、舞照跳，依然稳得让人安心。
亲测三年稳定的一批，拿来做主力绝对够！也可以保存下来，以备不时之需，反正左右都是非常好的选择！
指路：https://dash.moeu01.com/#/register?code=NOwBzWCE         
            </textarea></div>
            <div class="box"><label>链接：</label><textarea id="linksText"></textarea></div>
        </div>
        <button class="btn-main btn-purple" onclick="processLinksTemplate()">🚀 一键批量生成</button>
        
        <button id="dlAllBtn" class="btn-dl-all" onclick="downloadAllZip()">📦 打包下载为 ZIP</button>
        
        <div id="output-container"></div>
    </div>

    <div id="tool3" class="tab-content">
        <div class="box" style="margin-bottom: 20px;">
            <label>输入文件列表：<span class="hint">支持拖入列表txt</span></label>
            <textarea id="treeInput" style="height: 300px;" placeholder="粘贴带有时间的文件名列表..."></textarea>
        </div>
        <button class="btn-main btn-blue" onclick="generateTree()">🌳 生成目录树 (按年份正序)</button>
        <div class="box">
            <label>预览结果：
                <div>
                    <button class="btn-small btn-copy" onclick="smoothCopy('treeOutput', this)">📋 复制目录</button>
                    <button class="btn-small btn-dl" onclick="downloadTree()">💾 下载目录TXT</button>
                </div>
            </label>
            <textarea id="treeOutput" readonly style="height: 400px; background: #fff; white-space: pre;"></textarea>
        </div>
    </div>

    <script>
        function smoothCopy(targetId, btnElement) {
            const textToCopy = document.getElementById(targetId).value;
            if (!textToCopy) return; 

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerHTML;
                const originalBgColor = btnElement.style.backgroundColor;
                btnElement.innerHTML = "✅ 已复制";
                btnElement.style.backgroundColor = "#27ae60"; 
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.style.backgroundColor = originalBgColor;
                }, 1500);
            }).catch(err => {
                console.error('复制失败:', err);
                alert("复制失败，请手动复制");
            });
        }

        function switchTab(evt, tabName) {
            const contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
            const btns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < btns.length; i++) btns[i].classList.remove("active");
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.classList.add("active");
        }

        function initDrag(id) {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); });
            el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
            el.addEventListener('drop', (e) => {
                e.preventDefault(); el.classList.remove('drag-over');
                const reader = new FileReader();
                reader.onload = (ev) => el.value = ev.target.result;
                reader.readAsText(e.dataTransfer.files[0], 'UTF-8');
            });
        }
        window.onload = () => ['text1', 'text2', 'templateText', 'linksText', 'treeInput'].forEach(initDrag);

        function generateTree() {
            const input = document.getElementById('treeInput').value.trim();
            if (!input) return alert("请输入文件列表");
            
            const lines = input.split('\n').filter(l => l.trim());
            const treeData = {};

            lines.forEach(line => {
                const yearMatch = line.match(/(\d{4})/);
                const year = yearMatch ? yearMatch[1] + "年" : "其他";
                if (!treeData[year]) treeData[year] = [];
                treeData[year].push(line.trim());
            });

            const years = Object.keys(treeData).sort((a, b) => a.localeCompare(b)); 

            let output = "📁 资源总目录索引\n";
            years.forEach((year, yIdx) => {
                const isLastYear = yIdx === years.length - 1;
                output += `${isLastYear ? '└── ' : '├── '}📂 ${year}\n`;
                
                const files = treeData[year].sort((a, b) => a.localeCompare(b));
                
                files.forEach((file, fIdx) => {
                    const isLastFile = fIdx === files.length - 1;
                    const prefix = isLastYear ? '    ' : '│   ';
                    output += `${prefix}${isLastFile ? '└── ' : '├── '}📄 ${file}\n`;
                });
                if (!isLastYear) output += `${isLastYear ? '' : '│'}\n`;
            });

            document.getElementById('treeOutput').value = output;
        }

        function downloadTree() { triggerDl('目录树索引.txt', document.getElementById('treeOutput').value); }
        
        function mergeTextsSimple() {
            const d1 = parseS(document.getElementById('text1').value), d2 = parseS(document.getElementById('text2').value);
            let res = ""; for (let id in d1) if(d2[id]) res += `${id}\n${d1[id]}\n${d2[id]}\n\n`;
            document.getElementById('result1').value = res.trim();
        }
        
        function parseS(t){
            const d = {}; t.trim().split(/\n\s*\n/).forEach(b => {
                const l = b.split('\n').filter(x=>x.trim());
                if(l.length>=2) d[l[0].trim()] = l.slice(1).join('\n');
            }); return d;
        }

        function triggerDl(fn, txt) {
            const blob = new Blob([txt], {type:'text/plain'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fn; a.click();
        }
        
        let gD = {};
        function processLinksTemplate() {
            const temp = document.getElementById('templateText').value, lText = document.getElementById('linksText').value;
            const out = document.getElementById('output-container'), lines = lText.split('\n');
            let cp = '', ci = '', dict = {};
            lines.forEach(l => {
                let c = l.trim(); if(!c || c.startsWith('--')) {ci=''; return;}
                if(c.includes('BD') && c.length<10) {cp='BD'; ci=''; return;}
                if(c.includes('KK') && c.length<10) {cp='KK'; ci=''; return;}
                if(!ci) { ci=c; if(!dict[ci]) dict[ci]={BD:[],KK:[]}; } else if(cp) dict[ci][cp].push(c);
            });
            out.innerHTML = ''; gD = {}; let count = 0;
            for(let id in dict) {
                count++; let final = temp.replace('{BD}', dict[id].BD.join('\n')||'无').replace('{KK}', dict[id].KK.join('\n')||'无');
                gD[id] = final; const card = document.createElement('div'); card.className='result-card';
                
                // 修改：加入了 Flexbox 布局，把标题和复制按钮包起来，让按钮直接顶到右上角
                card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0; color: #34495e;">${id}</h3>
                    <button class="btn-small btn-copy" onclick="smoothCopy('o_${count}', this)">📋 复制</button>
                </div>
                <textarea id="o_${count}" style="height:100px;width:100%; margin-bottom: 0;">${final}</textarea>`;
                
                out.appendChild(card);
            }
            document.getElementById('dlAllBtn').style.display = count>0?'block':'none';
        }

        function downloadAllZip() { 
            if (typeof JSZip === 'undefined') {
                alert("ZIP 打包组件加载失败，请检查网络或刷新页面重试。");
                return;
            }
            const zip = new JSZip();
            for(let id in gD) { zip.file(id + '.txt', gD[id]); }
            const btn = document.getElementById('dlAllBtn');
            btn.innerText = "📦 正在打包中...";
            btn.style.opacity = "0.7";
            zip.generateAsync({type:"blob"}).then(function(content) {
                const a = document.createElement('a'); 
                a.href = URL.createObjectURL(content); 
                a.download = "发帖模板合集.zip"; 
                a.click();
                btn.innerText = "📦 打包下载为 ZIP";
                btn.style.opacity = "1";
            });
        }
    </script>
</body>
</html>
